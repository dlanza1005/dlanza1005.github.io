<script>
/* ============================================================
   DATA + DERIVED STATS
   ============================================================ */
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const LEVELS = [[0, 'Title only'], [1, 'Summaries'], [2, 'Full text']];
const WORDS_PER_MIN = 230;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const countWords = s => (String(s).match(/\S+/g) || []).length;
const fmt = n => n.toLocaleString('en-US');
const plural = (n, word) => `${fmt(n)} ${word}${n === 1 ? '' : 's'}`;

// Precompute per-project photo lists and stats once.
for (const p of DATA.projects) {
  p.allPhotos = [...p.photos];
  p.words = countWords(p.title + ' ' + p.tagline);
  p.chapters.forEach((c, i) => {
    c.index = i;
    c.photoOffset = p.allPhotos.length;
    p.allPhotos.push(...c.photos);
    c.words = countWords([c.title, c.summary, ...c.body].join(' '));
    p.words += c.words;
  });
  p.minutes = Math.max(1, Math.round(p.words / WORDS_PER_MIN));
}
const MAX_WORDS = Math.max(...DATA.projects.map(p => p.words));
const MAX_PHOTOS = Math.max(1, ...DATA.projects.map(p => p.allPhotos.length));
const findProject = id => DATA.projects.find(p => p.id === id);

/* ============================================================
   VIEW STATE
   Each project card has its own view: detail level (0-2) and
   whether photos show. Photos are on by default, and choosing
   "Full text" always turns them back on.
   ============================================================ */
const state = { view: 'home' };
const DEFAULT_CARD = { level: 0, photos: true };
const cards = {};   // project id -> { level, photos }
const cardOf = p => (cards[p.id] ??= { ...DEFAULT_CARD });

function setLevel(p, level) {
  const c = cardOf(p);
  c.level = level;
  if (level === 2) c.photos = true;
}

/* ============================================================
   SMALL RENDER HELPERS
   ============================================================ */
function segmented(options, active, attrs, cls = '', label = '') {
  return `<div class="seg ${cls}" role="group" aria-label="${esc(label)}">` +
    options.map(([value, text]) =>
      `<button type="button" ${attrs} data-level="${value}" aria-pressed="${value === active}">${text}</button>`
    ).join('') + '</div>';
}

function photoTile(p, idx, withCaption = true) {
  const ph = p.allPhotos[idx];
  const inner = ph.src ? `<img src="${esc(ph.src)}" alt="${esc(ph.caption)}">` : `<span class="ph">PHOTO</span>`;
  const tile = `<button type="button" class="photo" data-action="photo" data-pid="${p.id}" data-idx="${idx}" aria-label="View photo: ${esc(ph.caption)}">${inner}</button>`;
  return withCaption ? `<figure>${tile}<figcaption>${esc(ph.caption)}</figcaption></figure>` : tile;
}

// Non-interactive cover, for use inside links (home cards).
function coverImage(p) {
  const ph = p.photos[0];
  return `<div class="photo" role="img" aria-label="${esc(ph.caption)}">${
    ph.src ? `<img src="${esc(ph.src)}" alt="">` : '<span class="ph">PHOTO</span>'}</div>`;
}

function gallery(p, start, count, cls = '') {
  if (!count) return '';
  let html = '';
  for (let i = start; i < start + count; i++) html += photoTile(p, i);
  return `<div class="gallery ${cls}">${html}</div>`;
}

function statsLine(p) {
  return `<div class="stats">
    <span class="mono">${plural(p.chapters.length, 'chapter')} · ${plural(p.words, 'word')} · ~${p.minutes} min · ${plural(p.allPhotos.length, 'photo')}</span>
    <div class="meters" title="Amount of content compared with the largest project">
      <span class="mono">TEXT</span><div class="meter"><span style="width:${Math.round(100 * p.words / MAX_WORDS)}%"></span></div>
      <span class="mono">PHOTOS</span><div class="meter"><span style="width:${Math.round(100 * p.allPhotos.length / MAX_PHOTOS)}%"></span></div>
    </div>
  </div>`;
}

/* ============================================================
   VIEWS
   ============================================================ */
function renderHome() {
  const cards = DATA.featured.map(findProject).filter(Boolean).map(p => `
    <a class="card" href="#p-${p.id}">
      ${p.photos.length ? coverImage(p) : ''}
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.tagline)}</p>
      <span class="mono">${plural(p.chapters.length, 'chapter')} · ${plural(p.allPhotos.length, 'photo')}</span>
    </a>`).join('');

  return `
    <section class="hero">
      <div>
        <h1>${esc(DATA.name)}</h1>
        <p class="pitch mono">${esc(DATA.pitch)}</p>
        <div class="intro">${DATA.intro.map(t => `<p>${esc(t)}</p>`).join('')}</div>
        <div class="actions">
          <a class="btn primary" href="#portfolio">View portfolio</a>
          <a class="btn" href="#resume">Resume</a>
        </div>
      </div>
      <div class="photo" role="img" aria-label="${esc(DATA.portrait.caption)}">${
        DATA.portrait.src ? `<img src="${esc(DATA.portrait.src)}" alt="">` : '<span class="ph">PORTRAIT</span>'}</div>
    </section>
    <div class="section-head"><h2>Selected projects</h2><a class="linkish" href="#portfolio">All ${DATA.projects.length} projects</a></div>
    <div class="cards">${cards}</div>`;
}

function renderAbout() {
  return `<section class="page"><h1>About</h1>
    <div class="prose">${DATA.about.map(t => `<p>${esc(t)}</p>`).join('')}</div></section>`;
}

function renderResume() {
  const r = DATA.resume;
  const sections = r.sections.map(s => `
    <section class="cv-section"><h2>${esc(s.title)}</h2>
      ${s.items.map(it => `<div class="cv-item">
        <span class="what">${esc(it.what)}</span><span class="mono">${esc(it.when)}</span>
        ${it.detail ? `<span class="detail">${esc(it.detail)}</span>` : ''}
      </div>`).join('')}
    </section>`).join('');
  return `<section class="page">
    <div class="resume-top"><h1>Resume</h1><a class="btn" href="${esc(r.pdf)}">Download PDF</a></div>
    <p class="note">On the live site, the PDF button links to your resume file.</p>
    ${sections}</section>`;
}

function renderChapter(p, c, card) {
  return `<li class="chapter" id="p-${p.id}-c${c.index + 1}">
    <div class="c-head">
      <span class="c-num">${String(c.index + 1).padStart(2, '0')}</span>
      <h3 class="c-title">${esc(c.title)}</h3>
      <span class="mono">${plural(c.words, 'word')}${c.photos.length ? ' · ' + plural(c.photos.length, 'photo') : ''}</span>
    </div>
    <p class="c-summary">${esc(c.summary)}</p>
    ${card.level === 2 ? `<div class="c-body">${c.body.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : ''}
    ${card.photos ? gallery(p, c.photoOffset, c.photos.length) : ''}
  </li>`;
}

function renderProject(p) {
  const card = cardOf(p);
  // Title only: one gallery of every photo. Otherwise: project photos here, chapter photos inside chapters.
  const photoBlock = !card.photos ? ''
    : gallery(p, 0, card.level === 0 ? p.allPhotos.length : p.photos.length, 'p-gallery');

  return `<article class="project" id="p-${p.id}" data-anchor>
    <div class="p-head">
      <h2><button type="button" class="p-title" data-action="title" data-pid="${p.id}" aria-expanded="${card.level > 0}">
        <span class="caret" aria-hidden="true">${card.level > 0 ? '−' : '+'}</span><span class="t">${esc(p.title)}</span></button></h2>
      <p class="tagline">${esc(p.tagline)}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${statsLine(p)}
      <div class="p-controls">
        ${segmented(LEVELS, card.level, `data-action="level" data-pid="${p.id}"`, 'small', 'Detail level')}
        ${p.allPhotos.length ? `<button type="button" class="btn small" data-action="photos" data-pid="${p.id}" aria-pressed="${card.photos}">
          ${card.photos ? 'Hide' : 'Show'} images &amp; captions (${p.allPhotos.length})</button>` : ''}
      </div>
    </div>
    ${photoBlock}
    ${card.level >= 1 ? `<ol class="chapters">${p.chapters.map(c => renderChapter(p, c, card)).join('')}</ol>` : ''}
  </article>`;
}

function renderPortfolio() {
  return `<section class="page">
    <h1>Portfolio</h1>
    <p class="sample">Sample content: bracketed text and striped photo tiles are placeholders to replace with your own.</p>
    <div class="projects">${DATA.projects.map(renderProject).join('')}</div>
  </section>`;
}

function renderFooter() {
  const c = DATA.contact;
  document.getElementById('footer').innerHTML = `
    <div><h2>Contact</h2>
      <div class="contact-list">
        <a href="mailto:${esc(c.email)}"><span>Email</span>${esc(c.email)}</a>
        <a href="https://${esc(c.linkedin)}"><span>LinkedIn</span>${esc(c.linkedin)}</a>
        <a href="https://${esc(c.github)}"><span>GitHub</span>${esc(c.github)}</a>
      </div>
    </div>
    <p class="mono" style="align-self:end">© ${new Date().getFullYear()} ${esc(DATA.name)}</p>`;
}

/* ============================================================
   RENDER + ROUTING
   ============================================================ */
const VIEWS = { home: renderHome, portfolio: renderPortfolio, about: renderAbout, resume: renderResume };
const app = document.getElementById('app');

// Re-render, keeping the element the user clicked in the same place on screen.
function render(anchorId) {
  const before = anchorId && document.getElementById(anchorId)?.getBoundingClientRect().top;
  app.innerHTML = VIEWS[state.view]();
  document.querySelectorAll('.nav a').forEach(a => {
    if (a.dataset.view === state.view) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  if (before != null) {
    const el = document.getElementById(anchorId);
    if (el) window.scrollBy({ top: el.getBoundingClientRect().top - before, behavior: 'instant' });
  }
}

function scrollToId(id) {
  requestAnimationFrame(() => document.getElementById(id)?.scrollIntoView({ block: 'start' }));
}

// Routes: #home #portfolio #about #resume, plus share links #p-<id> and #p-<id>-c<n>.
function route() {
  const hash = location.hash.slice(1) || 'home';
  const m = hash.match(/^p-([a-z0-9-]+?)(?:-c(\d+))?$/);
  const p = m && findProject(m[1]);
  if (p) {
    state.view = 'portfolio';
    setLevel(p, 2);
    render();
    scrollToId(hash);
    return;
  }
  state.view = VIEWS[hash] ? hash : 'home';
  render();
  window.scrollTo(0, 0);
}

/* ============================================================
   EVENTS (one delegated handler)
   ============================================================ */
const ACTIONS = {
  level:  (b, p) => setLevel(p, +b.dataset.level),
  title:  (b, p) => setLevel(p, cardOf(p).level > 0 ? 0 : 1),
  photos: (b, p) => { cardOf(p).photos = !cardOf(p).photos; },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const action = b.dataset.action;
  const p = b.dataset.pid && findProject(b.dataset.pid);

  if (ACTIONS[action]) {
    ACTIONS[action](b, p);
    render(b.closest('[data-anchor]')?.id);
    return;
  }
  switch (action) {
    case 'contact':
      document.getElementById('contact').scrollIntoView({ block: 'start' });
      break;
    case 'photo':
      e.preventDefault();
      openLightbox(p, +b.dataset.idx, b);
      break;
  }
});

/* ============================================================
   LIGHTBOX (steps through every photo in one project)
   ============================================================ */
const lb = { el: document.getElementById('lightbox'), p: null, idx: 0, returnFocus: null };

function drawLightbox() {
  const ph = lb.p.allPhotos[lb.idx];
  const many = lb.p.allPhotos.length > 1;
  lb.el.innerHTML = `<div class="lb-inner">
    <div class="photo">${ph.src ? `<img src="${esc(ph.src)}" alt="${esc(ph.caption)}">` : '<span class="ph">PHOTO</span>'}</div>
    <div class="lb-bar">
      <span class="cap">${esc(ph.caption)} <span class="mono" style="color:#bbb">· ${esc(lb.p.title)} · ${lb.idx + 1}/${lb.p.allPhotos.length}</span></span>
      ${many ? '<button type="button" data-lb="prev" aria-label="Previous photo">←</button><button type="button" data-lb="next" aria-label="Next photo">→</button>' : ''}
      <button type="button" data-lb="close">Close</button>
    </div></div>`;
}
function openLightbox(p, idx, from) {
  Object.assign(lb, { p, idx, returnFocus: from });
  drawLightbox();
  lb.el.classList.add('open');
  lb.el.querySelector('[data-lb="close"]').focus();
}
function closeLightbox() { lb.el.classList.remove('open'); lb.returnFocus?.focus(); }
function stepLightbox(d) { const n = lb.p.allPhotos.length; lb.idx = (lb.idx + d + n) % n; drawLightbox(); lb.el.querySelector('[data-lb="close"]').focus(); }

lb.el.addEventListener('click', e => {
  const cmd = e.target.closest('[data-lb]')?.dataset.lb;
  if (cmd === 'prev') stepLightbox(-1);
  else if (cmd === 'next') stepLightbox(1);
  else if (cmd === 'close' || e.target === lb.el) closeLightbox();
  e.stopPropagation();
});
document.addEventListener('keydown', e => {
  if (!lb.el.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') stepLightbox(-1);
  if (e.key === 'ArrowRight') stepLightbox(1);
});

/* ============================================================
   START
   ============================================================ */
document.getElementById('brand').textContent = DATA.name;
renderFooter();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
